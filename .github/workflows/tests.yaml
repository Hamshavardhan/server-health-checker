
name: Server Health Checker CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-timestamp:
    name: Generate Run Timestamp
    runs-on: windows-latest
    outputs:
      timestamp: ${{ steps.time.outputs.timestamp }}

    steps:
      - name: Get current date and time
        id: time
        shell: pwsh
        run: |
          $timestamp = Get-Date -Format "yyyy-MM-dd HH-mm-ss"
          "timestamp=$timestamp" >> $env:GITHUB_OUTPUT

  server-health-check:
    name: Health Check - ${{ needs.generate-timestamp.outputs.timestamp }}
    needs: generate-timestamp
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install psutil pytest

      - name: Run automated tests
        run: python -m pytest -v
